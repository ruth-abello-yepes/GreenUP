<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Verificar Código | GreenUp</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <style>
        :root {
            --color-primary: #003d6c;
            --color-secondary: #296c1f;
            --color-surface-bright: #f8f9ff;
            --color-surface-lowest: #ffffff;
            --color-on-surface: #121c2a;
            --color-on-surface-variant: #414750;
            --color-outline-variant: #c1c7d1;
            --color-on-primary: #ffffff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(180deg, #f5fbf7 0%, #ffffff 48%);
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .login-card {
            width: 100%;
            max-width: 1120px;
            min-height: min(680px, calc(100vh - 32px));
            background-color: var(--color-surface-lowest);
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 20px 50px -12px rgba(0, 61, 108, 0.12);
        }

        .form-col {
            padding: clamp(16px, 3vh, 32px) clamp(30px, 4vw, 56px);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .btn-back {
            background: none;
            border: none;
            color: var(--color-on-surface-variant);
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            margin-bottom: 20px;
        }

        .recovery-title {
            color: var(--color-primary);
            font-size: clamp(2rem, 8vw, 3.2rem);
            letter-spacing: 0;
            line-height: 1.05;
        }

        .recovery-help {
            color: var(--color-on-surface-variant);
            font-size: clamp(1rem, 4vw, 1.18rem);
            line-height: 1.5;
        }

        .timer-box {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 14px;
            border-radius: 999px;
            background: #eaf5ef;
            color: #0f6b2f;
            font-weight: 800;
            margin: 6px 0 14px;
        }

        .timer-box.expired {
            background: #fdecec;
            color: #b42318;
        }

        .timer-box.warning {
            background: #fff4df;
            color: #9a5b00;
        }

        .resend-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin-top: 14px;
            color: var(--color-primary);
            font-weight: 800;
            text-decoration: none;
        }

        .resend-link[hidden] {
            display: none;
        }

        .otp-container {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: clamp(6px, 2.4vw, 12px);
            justify-content: stretch;
            margin: 25px 0;
        }

        .otp-input {
            width: 100%;
            min-width: 0;
            aspect-ratio: 1 / 1.15;
            max-height: 62px;
            text-align: center;
            font-size: clamp(20px, 7vw, 26px);
            font-weight: 700;
            background-color: var(--color-surface-bright);
            border: 2px solid var(--color-outline-variant);
            border-radius: 12px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .otp-input:focus {
            border-color: var(--color-primary);
            box-shadow: 0 0 0 3px rgba(0, 61, 108, 0.12);
        }

        .btn-login {
            width: 100%;
            padding: 13px 24px;
            background-color: var(--color-primary);
            color: var(--color-on-primary);
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 20px rgba(0, 61, 108, 0.2);
        }

        .hero-col {
            position: relative;
            height: 100%;
        }

        .hero-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0, 61, 108, 0.6) 0%, rgba(41, 108, 31, 0.4) 100%);
        }

        @media (max-width: 767.98px) {
            body {
                align-items: flex-start;
                padding: 10px;
            }

            .login-card {
                min-height: auto;
                border-radius: 20px;
                box-shadow: none;
            }

            .form-col {
                min-height: calc(100vh - 20px);
                justify-content: flex-start;
                padding: 24px 18px 30px;
            }

            .btn-back {
                margin-bottom: 26px;
                font-size: 15px;
            }

            .otp-container {
                margin: 22px 0 20px;
            }

            .btn-login {
                min-height: 58px;
                font-size: 16px;
                font-weight: 800;
                border-radius: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="login-card d-flex">
        <div class="form-col flex-grow-1">
            <a href="public_recuperar_contrasena.html" class="btn-back">
                <span class="material-symbols-outlined">arrow_back</span>
                Cambiar correo
            </a>

            <div class="mb-3">
                <h1 class="recovery-title fw-bold mb-2">Ingresa el código</h1>
                <p class="recovery-help">
                    Escribe el código de 6 dígitos que enviamos a tu correo electrónico. Tienes 60 segundos.
                </p>
                <div id="contadorCodigo" class="timer-box" aria-live="polite">
                    <span class="material-symbols-outlined">timer</span>
                    <span>Vence en 60 s</span>
                </div>
            </div>

            <form id="formVerificarCodigo">
                <div class="otp-container">
                    <input type="text" maxlength="1" class="otp-input" pattern="[0-9]" inputmode="numeric" required />
                    <input type="text" maxlength="1" class="otp-input" pattern="[0-9]" inputmode="numeric" required />
                    <input type="text" maxlength="1" class="otp-input" pattern="[0-9]" inputmode="numeric" required />
                    <input type="text" maxlength="1" class="otp-input" pattern="[0-9]" inputmode="numeric" required />
                    <input type="text" maxlength="1" class="otp-input" pattern="[0-9]" inputmode="numeric" required />
                    <input type="text" maxlength="1" class="otp-input" pattern="[0-9]" inputmode="numeric" required />
                </div>

                <button class="btn-login" type="submit">
                    Validar código
                    <span class="material-symbols-outlined">verified</span>
                </button>

                <a id="solicitarNuevoCodigo" class="resend-link" href="public_recuperar_contrasena.html" hidden>
                    <span class="material-symbols-outlined">refresh</span>
                    Solicitar un código nuevo
                </a>
            </form>
        </div>

        <div class="hero-col d-none d-lg-block" style="width:50%;">
            <img class="hero-img" alt="Sostenibilidad"
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuDElT_oscI5c48pbSED-PUmZBwmonaFm-1teBZ_L5UbYlj2tV50xbUlxkp-hunrDqdf4A8h936CTTr-48EjlGCETlpsTTCXQp0Zz0ARYwaYpktH1gM9xtTWVlP8g5r9J8B2GTiKi89y9tlIVqUeckUaD3keYhXnO3bNQme6OwwrA67RbCujLg-1BhUAW38gK7z8zKXTvmj3RUzEPrXaM9uUTyNa-ey1NQlfKprqnG47UW5M7o-QWgOCNGxnMJc43ULUI1cIHQnFTAE" />
            <div class="hero-overlay"></div>
        </div>
    </div>
  <script src="../../js/modal_alerts.js?v=20260827"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/recuperacion.js?v=20260831"></script>
  <script src="../../js/public_ui_fix.js?v=20260901-a11y3"></script>
</body>

</html>
