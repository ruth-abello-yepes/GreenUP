<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registros de reciclaje - GreenUp Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <style>
:root {
  --admin-green: #0f6f2a;
  --admin-green-dark: #075f1d;
  --admin-logo-green: #478a3a;
  --admin-blue: #065591;
  --admin-blue-dark: #043a63;
  --admin-blue-soft: #e9f4ff;
  --admin-mint: #eefbf3;
  --admin-page: #f8fbf9;
  --admin-panel: #ffffff;
  --admin-ink: #172033;
  --admin-muted: #68717b;
  --admin-border: #e3ebe6;
  --admin-soft-border: #d3e4d9;
  --admin-warning: #fff4cf;
  --admin-danger: #fff0f0;
  --sidebar-width: 316px;
  --topbar-height: 88px;
  --radius-lg: 18px;
  --shadow-soft: 0 14px 34px rgba(6, 85, 145, 0.08);
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body.admin-app {
  min-height: 100vh;
  margin: 0;
  background: var(--admin-page);
  color: var(--admin-ink);
  font-family: "Manrope", Arial, Helvetica, sans-serif;
  letter-spacing: 0;
  overflow-x: hidden;
}

body.admin-theme-dark {
  /*
    TEMA OSCURO GLOBAL:
    Estas variables cambian todo el Administrador del Sistema, no solo el perfil.
  */
  --admin-green: #39d874;
  --admin-green-dark: #8df2aa;
  --admin-logo-green: #66e58d;
  --admin-blue: #5eb2ff;
  --admin-blue-dark: #b8dcff;
  --admin-blue-soft: #102d48;
  --admin-mint: #123322;
  --admin-page: #08111d;
  --admin-panel: #101b2a;
  --admin-ink: #eef6ff;
  --admin-muted: #a8b5c5;
  --admin-border: #213247;
  --admin-soft-border: #2c4258;
  --admin-warning: #3b3216;
  --admin-danger: #3a171b;
  --shadow-soft: 0 18px 42px rgba(0, 0, 0, 0.32);
  background:
    radial-gradient(circle at top right, rgba(57, 216, 116, 0.14), transparent 30%),
    linear-gradient(135deg, #07111f 0%, #08111d 50%, #0d1b2d 100%);
}

body.admin-theme-light {
  background: var(--admin-page);
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
select,
textarea {
  font: inherit;
}

.material-symbols-outlined {
  font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
  font-size: 24px;
  line-height: 1;
}

.material-symbols-outlined.filled {
  font-variation-settings: "FILL" 1, "wght" 650, "GRAD" 0, "opsz" 24;
}

.app-sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 30;
  width: var(--sidebar-width);
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding: 30px 24px 24px;
  background: rgba(255, 255, 255, 0.98);
  border-right: 1px solid var(--admin-border);
  box-shadow: 12px 0 32px rgba(15, 111, 42, 0.05);
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-gutter: stable;
}

.brand-lockup,
.mobile-brand {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

.brand-logo {
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: #ffffff;
  color: var(--admin-blue);
  font-weight: 900;
  box-shadow: 0 12px 24px rgba(15, 111, 42, 0.14);
}

.brand-logo span {
  color: var(--admin-green);
  font-size: 31px;
}

.brand-name {
  display: block;
  color: var(--admin-blue);
  font-size: 1.55rem;
  font-weight: 900;
  line-height: 1;
  white-space: nowrap;
}

.brand-name strong {
  color: var(--admin-logo-green);
  font-weight: inherit;
}

.brand-kicker {
  display: block;
  margin-top: 6px;
  color: #87909b;
  font-size: 0.72rem;
  font-weight: 850;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.sidebar-section-title {
  margin: 0 0 8px;
  color: #9aa2ad;
  font-size: 0.74rem;
  font-weight: 850;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-right: 4px;
}

.sidebar-link {
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 0 14px;
  border-radius: 14px;
  color: #606871;
  font-size: 0.93rem;
  font-weight: 750;
  transition: background-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
}

.sidebar-link:hover,
.sidebar-link:focus-visible,
.sidebar-link.active {
  background: #f1f7f3;
  color: var(--admin-green-dark);
}

.sidebar-link:hover,
.sidebar-link:focus-visible {
  transform: translateX(2px);
}

.sidebar-link.active {
  box-shadow: inset -4px 0 0 var(--admin-green);
}

.sidebar-link.active .material-symbols-outlined {
  color: var(--admin-green);
  font-variation-settings: "FILL" 1, "wght" 650, "GRAD" 0, "opsz" 24;
}

.sidebar-actions {
  display: grid;
  gap: 12px;
  padding-top: 18px;
  border-top: 1px solid var(--admin-border);
}

.logout-link,
.ghost-button,
.primary-button,
.small-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 42px;
  border: 0;
  border-radius: 13px;
  cursor: pointer;
  font-weight: 850;
  text-align: center;
}

.logout-link {
  justify-content: flex-start;
  background: transparent;
  color: #74706f;
}

.logout-link:hover {
  color: var(--admin-green-dark);
}

.primary-button {
  padding: 0 16px;
  background: var(--admin-green);
  color: #ffffff;
  box-shadow: 0 12px 24px rgba(15, 111, 42, 0.16);
}

.primary-button:hover {
  background: var(--admin-green-dark);
}

.ghost-button,
.small-button {
  padding: 0 14px;
  background: #edf4f0;
  color: #56616d;
}

.ghost-button:hover,
.small-button:hover {
  background: #dff4e5;
  color: var(--admin-green-dark);
}

.danger-button {
  background: #fff0f0;
  color: #bd1e1e;
}

.danger-button:hover {
  background: #ffe1e1;
}

.app-topbar {
  position: fixed;
  inset: 0 0 auto var(--sidebar-width);
  z-index: 25;
  min-height: var(--topbar-height);
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 40px;
  background: linear-gradient(90deg, #f6fbf8 0%, #effbf4 100%);
  border-bottom: 1px solid var(--admin-border);
}

.mobile-brand {
  display: none;
}

.topbar-search {
  flex: 1 1 280px;
  min-width: 210px;
  max-width: 520px;
}

.search-shell {
  position: relative;
}

.search-shell .material-symbols-outlined {
  position: absolute;
  left: 16px;
  top: 50%;
  color: #9aa2ad;
  transform: translateY(-50%);
}

.search-shell input {
  width: 100%;
  min-height: 48px;
  padding: 0 18px 0 50px;
  border: 1px solid var(--admin-border);
  border-radius: 999px;
  background: #ffffff;
  color: var(--admin-ink);
  outline: none;
}

.search-shell input:focus {
  border-color: var(--admin-green);
  box-shadow: 0 0 0 4px rgba(15, 111, 42, 0.1);
}

.topbar-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.icon-button {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 15px;
  background: #ffffff;
  color: #6f7680;
  cursor: pointer;
  box-shadow: 0 10px 22px rgba(6, 85, 145, 0.07);
}

.icon-button:hover {
  color: var(--admin-green-dark);
  background: var(--admin-mint);
}

.user-menu {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  padding: 6px 14px 6px 6px;
  border-radius: 999px;
  background: #ffffff;
  box-shadow: 0 10px 22px rgba(6, 85, 145, 0.07);
}

.user-avatar {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: linear-gradient(145deg, var(--admin-blue), #031d31);
  color: #ffffff;
  font-weight: 900;
}

.user-meta {
  display: grid;
  line-height: 1.1;
}

.user-meta strong {
  color: var(--admin-ink);
  font-size: 0.9rem;
}

.user-meta span {
  color: var(--admin-muted);
  font-size: 0.75rem;
}

.admin-main {
  min-height: 100vh;
  margin-left: var(--sidebar-width);
  padding: calc(var(--topbar-height) + 34px) 40px 44px;
}

.page-hero {
  position: relative;
  overflow: hidden;
  align-items: stretch;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(300px, 0.72fr);
  gap: 28px;
  margin-bottom: 26px;
  padding: 34px;
  border: 1px solid var(--admin-border);
  border-radius: 28px;
  background: #ffffff;
  box-shadow: var(--shadow-soft);
}

.hero-copy {
  position: relative;
  z-index: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  color: var(--admin-green-dark);
  font-size: 0.78rem;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.page-hero h1 {
  margin: 0;
  color: var(--admin-ink);
  font-size: clamp(2.2rem, 3.2vw, 3.45rem);
  line-height: 1.04;
  overflow-wrap: anywhere;
}

.page-hero h1 strong {
  color: var(--admin-green);
}

.page-hero p {
  max-width: 690px;
  margin: 16px 0 0;
  color: #59626d;
  font-size: 1rem;
  line-height: 1.65;
}

.hero-visual {
  position: relative;
  overflow: hidden;
  min-height: 250px;
  border-radius: 24px;
  background: #dfeee6;
}

.hero-carousel,
.hero-slide,
.hero-slide::after {
  position: absolute;
  inset: 0;
}

.hero-slide {
  opacity: 0;
  background-position: center;
  background-size: cover;
  transform: scale(1.04);
  transition: opacity 900ms ease, transform 7000ms ease;
}

.hero-slide.active {
  opacity: 1;
  transform: scale(1);
}

.hero-slide::after {
  content: "";
  background:
    linear-gradient(180deg, rgba(3, 29, 49, 0.08), rgba(7, 95, 29, 0.25)),
    linear-gradient(90deg, rgba(255, 255, 255, 0.06), transparent);
}

.hero-carousel-card {
  position: absolute;
  left: 20px;
  right: 20px;
  bottom: 20px;
  z-index: 3;
  min-height: 58px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 12px 14px;
  border: 1px solid rgba(255, 255, 255, 0.72);
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.84);
  backdrop-filter: blur(10px);
}

.hero-carousel-card strong {
  color: var(--admin-blue-dark);
  font-size: 0.9rem;
}

.hero-carousel-card span {
  color: var(--admin-muted);
  font-size: 0.78rem;
  font-weight: 850;
}

.carousel-dots {
  display: flex;
  align-items: center;
  gap: 5px;
}

.carousel-dots i {
  width: 6px;
  height: 6px;
  display: block;
  border-radius: 999px;
  background: #b8c7bc;
}

.carousel-dots i.active {
  width: 18px;
  background: var(--admin-green);
}

.hero-stats {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: repeat(2, minmax(130px, 1fr));
  gap: 14px;
  margin-top: 24px;
  max-width: 420px;
}

.summary-card {
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--admin-border);
  border-radius: 18px;
  background: var(--admin-panel);
  box-shadow: 0 18px 30px rgba(6, 85, 145, 0.08);
}

.summary-card.blue {
  background: var(--admin-blue-soft);
  border-color: #c9dff8;
}

.summary-label {
  display: block;
  color: #69727c;
  font-size: 0.75rem;
  font-weight: 850;
}

.summary-value {
  display: block;
  margin-top: 7px;
  color: var(--admin-green-dark);
  font-size: 1.45rem;
  font-weight: 900;
}

.summary-card.blue .summary-value {
  color: #0055b8;
}

.toolbar,
.data-card,
.module-card,
.admin-card {
  min-width: 0;
  border: 1px solid var(--admin-border);
  border-radius: var(--radius-lg);
  background: var(--admin-panel);
  box-shadow: var(--shadow-soft);
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding: 16px;
}

.toolbar > * {
  max-width: 100%;
}

.toolbar select,
.toolbar input,
.admin-form input,
.admin-form select,
.admin-form textarea {
  width: 100%;
  min-width: 0;
  min-height: 44px;
  border: 1px solid var(--admin-border);
  border-radius: 13px;
  background: #ffffff;
  color: var(--admin-ink);
  outline: none;
  padding: 0 14px;
}

.toolbar select,
.toolbar input {
  width: auto;
  min-width: 180px;
  flex: 0 1 240px;
}

.admin-form textarea {
  min-height: 112px;
  padding-top: 12px;
  resize: vertical;
}

.toolbar select:focus,
.toolbar input:focus,
.admin-form input:focus,
.admin-form select:focus,
.admin-form textarea:focus {
  border-color: var(--admin-green);
  box-shadow: 0 0 0 4px rgba(15, 111, 42, 0.1);
}

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}

.metric-card {
  display: grid;
  gap: 12px;
  min-height: 152px;
  padding: 20px;
  border: 1px solid var(--admin-border);
  border-radius: var(--radius-lg);
  background: var(--admin-panel);
  box-shadow: var(--shadow-soft);
}

.metric-icon {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: var(--admin-mint);
  color: var(--admin-green);
}

.metric-card.blue .metric-icon {
  background: var(--admin-blue-soft);
  color: #0055b8;
}

.metric-card strong {
  color: var(--admin-ink);
  font-size: 1.85rem;
  line-height: 1;
}

.metric-card span {
  color: var(--admin-muted);
  font-weight: 800;
}

.metric-card p {
  margin: 0;
  color: #6a737d;
  font-size: 0.86rem;
}

.content-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(280px, 0.75fr);
  gap: 20px;
}

.content-grid.catalog-layout {
  grid-template-columns: minmax(280px, 0.52fr) minmax(0, 1.48fr);
  align-items: start;
}

.content-grid.content-layout {
  grid-template-columns: minmax(280px, 0.62fr) minmax(0, 1.38fr);
  align-items: start;
}

.content-grid > * {
  min-width: 0;
}

.data-card,
.module-card,
.admin-card {
  padding: 22px;
}

.card-title-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}

.card-title-row h2,
.card-title-row h3 {
  margin: 0;
  color: var(--admin-ink);
  font-size: 1.1rem;
}

.card-title-row p {
  margin: 4px 0 0;
  color: var(--admin-muted);
  font-size: 0.88rem;
}

.table-wrap {
  width: 100%;
  min-width: 0;
  overflow-x: auto;
}

.admin-table {
  width: 100%;
  min-width: 860px;
  border-collapse: collapse;
}

.admin-table th {
  padding: 14px 12px;
  color: #626c77;
  font-size: 0.78rem;
  font-weight: 900;
  letter-spacing: 0.06em;
  text-align: left;
  text-transform: uppercase;
  border-bottom: 1px solid var(--admin-border);
}

.admin-table td {
  padding: 14px 12px;
  color: #384250;
  font-size: 0.9rem;
  border-bottom: 1px solid #edf2ef;
  vertical-align: middle;
}

.admin-table tbody tr:hover td {
  background: #fbfdfc;
}

.row-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.status-pill,
.type-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 30px;
  padding: 0 10px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 900;
}

.status-pill.active,
.type-pill.green {
  border: 1px solid #bde2c6;
  background: #e9f8ee;
  color: #146c2e;
}

.status-pill.inactive,
.type-pill.red {
  border: 1px solid #ffc9c9;
  background: #fff0f0;
  color: #bd1e1e;
}

.status-pill.pending,
.type-pill.blue {
  border: 1px solid #c7defa;
  background: #edf5ff;
  color: #0055b8;
}

.empty-state {
  display: grid;
  place-items: center;
  min-height: 190px;
  color: var(--admin-muted);
  text-align: center;
  border: 1px dashed var(--admin-soft-border);
  border-radius: 18px;
  background:
    linear-gradient(90deg, rgba(15, 111, 42, 0.05) 1px, transparent 1px),
    linear-gradient(rgba(15, 111, 42, 0.05) 1px, transparent 1px),
    #f8fcfa;
  background-size: 34px 34px;
}

.empty-state span {
  display: block;
  margin-bottom: 10px;
  color: var(--admin-green);
  font-size: 40px;
}

.admin-form {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.admin-form label {
  min-width: 0;
  display: grid;
  gap: 7px;
  color: #4c5966;
  font-size: 0.84rem;
  font-weight: 850;
}

.admin-form .full {
  grid-column: 1 / -1;
}

.content-grid.catalog-layout .admin-form,
.content-grid.content-layout .admin-form,
.module-card .admin-form,
.admin-card .admin-form {
  /*
    FORMULARIOS EN TARJETAS ESTRECHAS:
    Se usa una sola columna para evitar campos cortados en materiales,
    noticias, contenido, registros, roles y demas catalogos.
  */
  grid-template-columns: minmax(0, 1fr);
}

.news-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}

.news-card {
  overflow: hidden;
  border: 1px solid var(--admin-border);
  border-radius: 18px;
  background: #ffffff;
}

.news-image {
  height: 145px;
  background: linear-gradient(135deg, var(--admin-blue-soft), var(--admin-mint));
}

.news-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.news-body {
  padding: 16px;
}

.news-body h3 {
  margin: 0 0 8px;
  color: var(--admin-ink);
}

.news-body p {
  margin: 0;
  color: var(--admin-muted);
  line-height: 1.5;
}

/* =====================================================================
   MODO OSCURO COMPLETO
   Este bloque transforma toda la interfaz administrativa: navbar, topbar,
   tablas, formularios, tarjetas, mapa, noticias y botones.
===================================================================== */
body.admin-theme-dark .app-sidebar {
  background: rgba(8, 17, 29, 0.98);
  border-right-color: var(--admin-border);
  box-shadow: 14px 0 36px rgba(0, 0, 0, 0.34);
}

body.admin-theme-dark .app-topbar {
  background: linear-gradient(90deg, rgba(8, 17, 29, 0.96), rgba(12, 32, 48, 0.96));
  border-bottom-color: var(--admin-border);
}

body.admin-theme-dark .brand-logo,
body.admin-theme-dark .icon-button,
body.admin-theme-dark .user-menu,
body.admin-theme-dark .search-shell input,
body.admin-theme-dark .toolbar select,
body.admin-theme-dark .toolbar input,
body.admin-theme-dark .admin-form input,
body.admin-theme-dark .admin-form select,
body.admin-theme-dark .admin-form textarea,
body.admin-theme-dark .news-card {
  border: 1px solid var(--admin-border);
  background: #101b2a;
  color: var(--admin-ink);
  box-shadow: 0 14px 30px rgba(0, 0, 0, 0.22);
}

body.admin-theme-dark .brand-name,
body.admin-theme-dark .user-meta strong,
body.admin-theme-dark .page-hero h1,
body.admin-theme-dark .metric-card strong,
body.admin-theme-dark .card-title-row h2,

function imagenesHeroModulo(modulo) {
  /*
    Carrusel automatico del administrador.
    Usa URLs fijas de imagen para evitar fallas de carga por busquedas dinamicas.
    Cada apartado arranca desde una posicion diferente, por eso el orden de las
    15 fotos cambia entre paginas y no se siente repetido.
  */
  const modulos = Object.keys(adminHeroImageGroups);
  const inicio = Math.max(0, modulos.indexOf(modulo));
  return Array.from({ length: 15 }, (_, index) => ({
    url: adminHeroImageBank[(inicio + index) % adminHeroImageBank.length],
    label: `Imagen ${index + 1} de 15`,
  }));
}

function iniciarCarruselHero() {
  /*
    Activa el paso automatico de imagenes del hero.
    Si el usuario cambia de pagina, el temporizador anterior se limpia primero.
  */
  if (adminHeroTimer) clearInterval(adminHeroTimer);

  const slides = Array.from(document.querySelectorAll(".hero-slide"));
  const dots = Array.from(document.querySelectorAll(".carousel-dots i"));
  if (slides.length <= 1) return;

  let activo = 0;
  adminHeroTimer = setInterval(() => {
    slides[activo].classList.remove("active");
    dots[activo]?.classList.remove("active");
    activo = (activo + 1) % slides.length;
    slides[activo].classList.add("active");
    dots[activo]?.classList.add("active");
  }, 3500);
}

  /*
    TEMA GLOBAL DEL ADMIN:
    Lee si el administrador quiere ver todo el panel en oscuro o blanco.
    Tambien acepta la clave antigua del perfil para no perder la preferencia.
  */
  const temaGuardado = localStorage.getItem("greenup_admin_tema")
    || localStorage.getItem("greenup_admin_perfil_modo")
    || "claro";
  return temaGuardado === "oscuro" ? "oscuro" : "claro";

  /*
    APLICA EL TEMA A TODA LA PAGINA:

  const tema = obtenerTemaAdminSistema();
  document.body.classList.remove("admin-theme-dark", "admin-theme-light");
  document.body.classList.add(tema === "oscuro" ? "admin-theme-dark" : "admin-theme-light");
}

  /*

function prepararNavbarAdmin() {
  /*
    NAVBAR ESTABLE:
    Cuando el administrador entra a un apartado de abajo, el sidebar se vuelve
    a construir. Guardamos su scroll y centramos el enlace activo para que el
    menu no se suba de golpe ni pierda la opcion seleccionada.
  */
  const sidebar = document.querySelector(".app-sidebar");
  if (!sidebar) return;

  const guardado = Number(sessionStorage.getItem("greenup_admin_sidebar_scroll") || 0);
  if (Number.isFinite(guardado) && guardado > 0) {
    sidebar.scrollTop = guardado;
  }

  const activo = sidebar.querySelector(".sidebar-link.active");
  if (activo) {
    const margen = 90;
    const arribaActivo = activo.offsetTop;
    const abajoActivo = arribaActivo + activo.offsetHeight;
    const arribaVisible = sidebar.scrollTop;
    const abajoVisible = arribaVisible + sidebar.clientHeight;

    if (arribaActivo < arribaVisible + margen || abajoActivo > abajoVisible - margen) {
      sidebar.scrollTop = Math.max(0, arribaActivo - (sidebar.clientHeight / 2) + (activo.offsetHeight / 2));
    }
  }

  sidebar.addEventListener("scroll", () => {
    sessionStorage.setItem("greenup_admin_sidebar_scroll", String(sidebar.scrollTop));
  }, { passive: true });

  sidebar.querySelectorAll("a").forEach((enlace) => {
    enlace.addEventListener("click", () => {
      sessionStorage.setItem("greenup_admin_sidebar_scroll", String(sidebar.scrollTop));
    });
  });
}

  const config = crudConfig[nombre];

  for (const campo of config.campos) {
    const nuevo = prompt(campo.label, actual[campo.id] ?? "");

    payload[campo.id] = normalizarValor(campo, nuevo);

  mostrarToast("Registro actualizado", "Los cambios quedaron guardados.");

  if (config.inhabilitar) {

    await apiAdmin(config.estado.replace(":id", id), {
      method: "PUT",
      body: JSON.stringify({ id_estado: 2 }),
    });
  }
  mostrarToast("Registro inactivado", "El estado fue actualizado.");
  await cargarCrud(nombre);
}

async function pintarPuntosMapa(puntos, ajustarVista = false) {
  if (!adminMap) return;
  const bounds = [];
  const lista = document.getElementById("recycling-list");
  if (lista) lista.innerHTML = "";

  if (adminLastPointCount !== null && puntos.length > adminLastPointCount) {
    notificarAdmin("Nuevo punto ecologico", "El mapa del administrador ya fue actualizado.");
  }
  adminLastPointCount = puntos.length;

  for (const punto of puntos) {
    const coords = await coordenadasPunto(punto);
    if (!coords) continue;

    bounds.push([coords.lat, coords.lng]);
    const color = Number(punto.id_estado) === 1 ? "#296c1f" : "#68717b";
    const popupHtml = `
      <!-- POPUP DEL PUNTO: muestra informacion real de Supabase. -->
      <div style="min-width:180px">
        <strong style="color:${color}">${limpiar(punto.nombre)}</strong><br>
        <span>${limpiar(punto.direccion)}</span><br>
        <span>${limpiar(punto.horario || "Horario por confirmar")}</span><br>
        ${estadoHtml(punto.id_estado)}
        <button class="route-button" onclick="trazarRutaAdmin(${coords.lat}, ${coords.lng})">Como llegar</button>
      </div>
    `;

    let marker = adminMarkers.get(punto.id_punto);
    if (marker) {
      marker.setLatLng([coords.lat, coords.lng]).setPopupContent(popupHtml);
    } else {
      marker = L.circleMarker([coords.lat, coords.lng], {
        radius: 10,
        fillColor: color,
        color: "#fff",
        weight: 2,
        opacity: 1,
        fillOpacity: 0.92,
      }).addTo(adminMap).bindPopup(popupHtml);
      adminMarkers.set(punto.id_punto, marker);
    }

    if (lista) lista.appendChild(renderPuntoSidebar(punto, coords, marker));
  }

  if (lista && !lista.children.length) {
    lista.innerHTML = `<div class="empty-state"><div><span class="material-symbols-outlined">location_off</span><strong>No hay puntos con ubicacion</strong><p>Cuando existan puntos en Supabase apareceran aqui.</p></div></div>`;
  }

  if (ajustarVista && bounds.length) adminMap.fitBounds(bounds, { padding: [40, 40] });
}

async function coordenadasPunto(punto) {
  /*
    Ubicacion de puntos para el mapa admin.
    1. Si Supabase trae latitud/longitud validas dentro de Valledupar, se usan.
    2. Si no, se geocodifica la direccion limitando la busqueda a Valledupar.
    3. Si el servicio no encuentra nada, se ubica cerca del centro para no mandar
       el mapa a otro pais o al mar.
  */
  const lat = Number(punto.latitud);
  const lng = Number(punto.longitud);
  if (coordenadaEnValledupar(lat, lng)) return { lat, lng };

  const clave = "greenup_geo_admin_v2_" + punto.id_punto;
  const guardado = localStorage.getItem(clave);
  if (guardado) {
    const coordsGuardadas = JSON.parse(guardado);
    if (coordenadaEnValledupar(coordsGuardadas.lat, coordsGuardadas.lng)) return coordsGuardadas;
  }

  if (punto.direccion) {
    const consulta = encodeURIComponent(`${punto.direccion}, Valledupar, Cesar, Colombia`);
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&bounded=1&viewbox=-73.36,10.57,-73.16,10.36&q=${consulta}`;
    const respuesta = await fetch(url);
    const datos = await respuesta.json();
    if (datos.length) {
      const coords = { lat: Number(datos[0].lat), lng: Number(datos[0].lon) };
      if (coordenadaEnValledupar(coords.lat, coords.lng)) {
        localStorage.setItem(clave, JSON.stringify(coords));
        return coords;
      }
    }
  }

  const fallback = coordenadaFallbackValledupar(punto.id_punto || 1);
  localStorage.setItem(clave, JSON.stringify(fallback));
  return fallback;
}

function coordenadaEnValledupar(lat, lng) {
  /* Rango aproximado de Valledupar para evitar que el mapa se vaya al mar. */
  return Number.isFinite(lat) && Number.isFinite(lng) && lat >= 10.35 && lat <= 10.58 && lng >= -73.36 && lng <= -73.12;
}

function coordenadaFallbackValledupar(id) {
  /* Coordenada segura cuando no hay lat/lng ni geocodificacion confiable. */
  const centro = { lat: 10.4631, lng: -73.2532 };
  const paso = Number(id) || 1;
  return {
    lat: centro.lat + ((paso % 7) - 3) * 0.006,
    lng: centro.lng + ((paso % 5) - 2) * 0.006,
  };
}

function iniciarGeolocalizacionAdmin() {
  /* GEOLOCALIZACION EN TIEMPO REAL: actualiza la ubicacion del administrador. */
  if (!navigator.geolocation || !adminMap) return;
  if (adminWatchId) navigator.geolocation.clearWatch(adminWatchId);

  adminWatchId = navigator.geolocation.watchPosition(
    (posicion) => {
      adminUserLocation = [posicion.coords.latitude, posicion.coords.longitude];
      if (!adminUserMarker) {
        const userIcon = L.divIcon({
          className: "custom-user-icon",
          html: `<div style="background-color:#007bff;width:18px;height:18px;border-radius:50%;border:3px solid white;box-shadow:0 0 10px rgba(0,0,0,.45);"></div>`,
          iconSize: [18, 18],
          iconAnchor: [9, 9],
        });
        adminUserMarker = L.marker(adminUserLocation, { icon: userIcon }).addTo(adminMap).bindPopup("Tu ubicacion actual");
      } else {
        adminUserMarker.setLatLng(adminUserLocation);
      }
    },
    () => mostrarToast("Ubicacion", "No fue posible obtener tu ubicacion actual."),
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 12000 },
  );
}

function centerMap() {
  if (adminUserLocation && adminMap) {
    adminMap.setView(adminUserLocation, 15, { animate: true });
    adminUserMarker?.openPopup();
  } else {
    iniciarGeolocalizacionAdmin();
    mostrarToast("Ubicacion", "Solicitando ubicacion del navegador.");
  }
}

function centrarUbicacionAdmin() {
  centerMap();
}

function trazarRutaAdmin(destinoLat, destinoLng) {
  /* BOTON COMO LLEGAR: usa Leaflet Routing Machine igual que ciudadano. */
  if (!adminUserLocation) {
    mostrarToast("Ruta", "Primero permite la ubicacion para calcular la ruta.");
    return;
  }
  if (!window.L || !L.Routing) {
    mostrarToast("Ruta", "El motor de rutas aun se esta cargando.");
    return;
  }
  if (adminRouteControl) adminMap.removeControl(adminRouteControl);

  adminRouteControl = L.Routing.control({
    waypoints: [L.latLng(adminUserLocation[0], adminUserLocation[1]), L.latLng(destinoLat, destinoLng)],
    show: false,
    addWaypoints: false,
    routeWhileDragging: false,
    fitSelectedRoutes: true,
    lineOptions: { styles: [{ color: "#296c1f", opacity: 0.85, weight: 6 }] },
  }).addTo(adminMap);
}

function cargarRecursoCss(href) {
  if (document.querySelector(`link[href="${href}"]`)) return;
  const css = document.createElement("link");
  css.rel = "stylesheet";
  css.href = href;
  document.head.appendChild(css);
}

function cargarScript(src) {
  return new Promise((resolve, reject) => {
    const existente = document.querySelector(`script[src="${src}"]`);
    if (existente) return resolve();
    const script = document.createElement("script");
    script.src = src;
    script.onload = resolve;
    script.onerror = () => reject(new Error("No se pudo cargar " + src));
    document.head.appendChild(script);
  });
}

function pintarTablaActual(data = adminTableData) {
  const contenedor = document.getElementById("tabla-admin");
  if (!contenedor) return;
  if (!data.length) {
    contenedor.innerHTML = renderEmpty("database", "No hay registros para mostrar.", "Cuando existan datos en Supabase apareceran aqui.");
    return;
  }

  const tieneAcciones = data.some((row) => row.actions);
  contenedor.innerHTML = `
    <div class="table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            ${adminTableColumns.map((col) => `<th>${limpiar(col)}</th>`).join("")}
            ${tieneAcciones ? "<th>Acciones</th>" : ""}
          </tr>
        </thead>
        <tbody>
          ${data.map((row) => `
            <tr>
              ${row.values.map((value) => `<td>${value}</td>`).join("")}
              ${tieneAcciones ? `<td><div class="row-actions">${row.actions || ""}</div></td>` : ""}
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function filtrarTablaActual() {
  const search = (document.getElementById("admin-search")?.value || "").toLowerCase();
  const tipo = document.getElementById("filtro-tipo-usuario")?.value || "";
  const estado = document.getElementById("filtro-estado")?.value || "";

  const filtrada = adminTableData.filter((row) => {
    const texto = row.values.map((v) => String(v).replace(/<[^>]+>/g, "")).join(" ").toLowerCase();
    const cumpleBusqueda = !search || texto.includes(search);
    const cumpleTipo = !tipo || texto.includes(tipo.toLowerCase());
    const cumpleEstado = !estado || texto.includes(estado.toLowerCase());
    return cumpleBusqueda && cumpleTipo && cumpleEstado;
  });

  pintarTablaActual(filtrada);
}

function tablaDatos(columnas, filas) {
  if (!filas.length) return renderEmpty("database", "No hay registros.", "Los datos apareceran cuando existan en Supabase.");
  return `
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr>${columnas.map((c) => `<th>${limpiar(c)}</th>`).join("")}</tr></thead>
        <tbody>
          ${filas.map((fila) => `<tr>${fila.map((v) => `<td>${limpiarHtmlPermitido(v)}</td>`).join("")}</tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderForm(id, campos, accion, textoBoton) {
  return `
    <form id="${id}" class="admin-form" onsubmit="${accion}">
      ${campos.map((campo) => renderField(campo)).join("")}
      <button class="primary-button full" type="submit">
        <span class="material-symbols-outlined">save</span>${textoBoton}
      </button>
    </form>
  `;
}

function renderField(campo) {
  const clase = campo.full ? "full" : "";
  if (campo.type === "textarea") {
    return `<label class="${clase}">${campo.label}<textarea id="${campo.id}"></textarea></label>`;
  }
  if (campo.type === "select") {
    return `
      <label class="${clase}">${campo.label}
        <select id="${campo.id}">
          ${campo.options.map((op) => `<option value="${op[0]}">${op[1]}</option>`).join("")}
        </select>
      </label>
    `;
  }
  return `<label class="${clase}">${campo.label}<input id="${campo.id}" type="${campo.type || "text"}" value="${campo.value || ""}"></label>`;
}

function leerFormulario(campos) {
  const data = {};
  campos.forEach((campo) => {
    const elemento = document.getElementById(campo.id);
    if (!elemento) return;
    data[campo.id] = normalizarValor(campo, elemento.value);
  });
  return data;
}

function normalizarValor(campo, valor) {
  if (campo.type === "number") return valor === "" ? null : Number(valor);
  if (campo.id && campo.id.startsWith("id_")) return valor === "" ? null : Number(valor);
  return valor;
}

function metric(icon, value, label, detail, color = "") {
  return `
    <article class="metric-card ${color}">
      <span class="metric-icon"><span class="material-symbols-outlined">${icon}</span></span>
      <strong>${limpiar(value)}</strong>
      <span>${limpiar(label)}</span>
      <p>${limpiar(detail)}</p>
    </article>
  `;
}

function renderNewsList(noticias) {
  if (!noticias.length) return renderEmpty("newspaper", "No hay noticias registradas.", "Cuando publiques novedades apareceran aqui.");
  return noticias.map((n) => `
    <div class="news-body">
      <h3>${limpiar(n.titulo)}</h3>
      <p>${limpiar(n.descripcion)}</p>
    </div>
  `).join("");
}

function renderNewsGrid(noticias) {
  if (!noticias.length) return renderEmpty("newspaper", "No hay noticias registradas.", "Publica la primera novedad desde el formulario.");
  return `
    <div class="news-grid">
      ${noticias.map((n) => {
        const activo = Number(n.id_estado) === 1;
        return `
          <article class="news-card">
            <div class="news-image">
              ${n.imagen ? `<img src="${limpiar(n.imagen)}" alt="${limpiar(n.titulo)}">` : ""}
            </div>
            <div class="news-body">
              <h3>${limpiar(n.titulo)}</h3>
              <p>${limpiar(n.descripcion)}</p>
              <p>${estadoHtml(n.id_estado)}</p>
              <div class="row-actions">
                <button class="small-button ${activo ? "danger-button" : ""}" type="button" onclick="cambiarEstadoNovedad(${n.id_novedad}, ${activo ? 2 : 1})">
                  ${activo ? "Inactivar" : "Activar"}
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("")}
    </div>
  `;
}

function renderEmpty(icon, title, text) {
  return `
    <div class="empty-state">
      <div>
        <span class="material-symbols-outlined">${icon}</span>
        <strong>${limpiar(title)}</strong>
        <p>${limpiar(text)}</p>
      </div>
    </div>
  `;
}

function estadoHtml(idEstado) {
  const activo = Number(idEstado) === 1;
  return `<span class="status-pill ${activo ? "active" : "inactive"}">${activo ? "Activo" : "Inactivo"}</span>`;
}

function nombreRol(idRol) {
  const roles = { 1: "Administrador", 2: "Recicladora", 3: "Ciudadano" };
  return roles[Number(idRol)] || "Sin rol";
}

function limpiar(valor) {
  return String(valor ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function limpiarHtmlPermitido(valor) {
  const texto = String(valor ?? "");
  if (texto.includes("status-pill") || texto.includes("type-pill")) return texto;
  return limpiar(texto);
}

function iniciales(nombre) {
  return String(nombre || "A").trim().slice(0, 1).toUpperCase();
}

  if (!("Notification" in window)) {
    mostrarToast("Notificaciones", "Este navegador no soporta notificaciones.");

  Notification.requestPermission().then((permiso) => {
    mostrarToast("Notificaciones", permiso === "granted" ? "Permiso activado." : "Permiso no activado.");
  });
}

function notificarAdmin(titulo, cuerpo) {
  mostrarToast(titulo, cuerpo);
  if ("Notification" in window && Notification.permission === "granted") {
    new Notification(titulo, { body: cuerpo });
  }
}

function mostrarToast(titulo, cuerpo) {
  const stack = document.getElementById("toast-stack");
  if (!stack) return;
  const toast = document.createElement("div");
  toast.className = "admin-toast";
  toast.innerHTML = `<strong>${limpiar(titulo)}</strong>${limpiar(cuerpo)}`;
  stack.appendChild(toast);
  setTimeout(() => toast.remove(), 4200);
}

function iniciarMonitoreoAdmin() {
  if (adminMonitor) clearInterval(adminMonitor);
  adminMonitor = setInterval(async () => {
    try {
      const usuarios = await apiAdmin("/api/usuarios/listar");
      if (adminLastUserCount !== null && usuarios.length > adminLastUserCount) {
        notificarAdmin("Nuevo usuario registrado", "La tabla del administrador se actualizara automaticamente.");
        if (moduloActual() === "usuarios" || moduloActual() === "panel") await cargarModuloAdmin();
      }
      adminLastUserCount = usuarios.length;

      if (moduloActual() === "mapa") await actualizarPuntosMapa(false);
      if (["puntos", "reportes", "estadisticas"].includes(moduloActual())) await cargarModuloAdmin();
    } catch (error) {
      console.warn("No se pudo ejecutar el monitoreo admin", error);
    }
  }, ADMIN_REFRESH_MS);
}

function exportarTablaCSV(nombreArchivo) {
  const filas = adminTableData;
  if (!filas.length) {
    mostrarToast("Exportacion", "No hay datos para exportar.");
    return;
  }
  const csv = [
    adminTableColumns.join(","),
    ...filas.map((row) => row.values.map((value) => `"${String(value).replace(/<[^>]+>/g, "").replaceAll('"', '""')}"`).join(",")),
  ].join("\n");

  const enlace = document.createElement("a");
  enlace.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  enlace.download = nombreArchivo;
  enlace.click();
  URL.revokeObjectURL(enlace.href);
}

function cerrarSesionAdminSistema() {
  localStorage.removeItem("usuario");
  window.location.href = "../public/admin_login.html";
}
