<body>

    <div class="login-card d-flex">
        <div class="form-col flex-grow-1">
            <a href="public_recuperar_contrasena.html" class="btn-back">
                <span class="material-symbols-outlined">arrow_back</span>
                Cambiar correo
            </a>

            <div class="mb-3">
                <h1 class="recovery-title fw-bold mb-2">Ingresa el código</h1>
                <p class="recovery-help">
                    Escribe el código de 6 dígitos que enviamos a tu correo electrónico. Tienes 5 minutos.
                </p>
                <div id="contadorCodigo" class="timer-box" aria-live="polite">
                    <span class="material-symbols-outlined">timer</span>
                    <span>Vence en 5 min</span>
                </div>
            </div>

            <form id="formVerificarCodigo">
                <div class="otp-container">
                    <input type="text" maxlength="1" class="otp-input" pattern="[0-9]" inputmode="numeric" required />
                    <input type="text" maxlength="1" class="otp-input" pattern="[0-9]" inputmode="numeric" required />
                    <input type="text" maxlength="1" class="otp-input" pattern="[0-9]" inputmode="numeric" required />
                    <input type="text" maxlength="1" class="otp-input" pattern="[0-9]" inputmode="numeric" required />
                    <input type="text" maxlength="1" class="otp-input" pattern="[0-9]" inputmode="numeric" required />
                    <input type="text" maxlength="1" class="otp-input" pattern="[0-9]" inputmode="numeric" required />
                </div>

                <button class="btn-login" type="submit">
                    Validar código
                    <span class="material-symbols-outlined">verified</span>
                </button>

                <a id="solicitarNuevoCodigo" class="resend-link" href="public_recuperar_contrasena.html" hidden>
                    <span class="material-symbols-outlined">refresh</span>
                    Solicitar un código nuevo
                </a>
            </form>
        </div>

        <div class="hero-col d-none d-lg-block public_verificar_codigo-inline-2">
            <img class="hero-img" alt="Sostenibilidad"
                src="https://lh3.googleusercontent.com/aida-public/AB6AXuDElT_oscI5c48pbSED-PUmZBwmonaFm-1teBZ_L5UbYlj2tV50xbUlxkp-hunrDqdf4A8h936CTTr-48EjlGCETlpsTTCXQp0Zz0ARYwaYpktH1gM9xtTWVlP8g5r9J8B2GTiKi89y9tlIVqUeckUaD3keYhXnO3bNQme6OwwrA67RbCujLg-1BhUAW38gK7z8zKXTvmj3RUzEPrXaM9uUTyNa-ey1NQlfKprqnG47UW5M7o-QWgOCNGxnMJc43ULUI1cIHQnFTAE" />
