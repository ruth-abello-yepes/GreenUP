<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Login Administrador - GreenUp</title>

    <link rel="stylesheet" href="../../css/general.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
      rel="stylesheet"
    />
  </head>

  <body class="login-fondo">
    <main class="login-contenedor">
      <section class="login-tarjeta">
        <h1>GreenUp</h1>
        <h2>Administrador del sistema</h2>

        <form onsubmit="iniciarSesionAdmin(event)">
          <label for="usuario">Usuario</label>
          <input
            type="text"
            id="usuario"
            placeholder="Usuario administrador"
            required
          />

          <label for="contrasena">Contraseña</label>
          <div class="campo-password">
            <input
              type="password"
              id="contrasena"
              placeholder="Contraseña"
              required
            />
            <button
              class="btn-ver-password"
              type="button"
              onclick="alternarPasswordAdmin('contrasena', this)"
              aria-label="Mostrar contraseña"
              aria-pressed="false"
            >
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>

          <label for="codigo_admin">Código administrador</label>
          <div class="campo-password">
            <input
              type="password"
              id="codigo_admin"
              placeholder="Código de acceso"
              required
            />
            <button
              class="btn-ver-password"
              type="button"
              onclick="alternarPasswordAdmin('codigo_admin', this)"
              aria-label="Mostrar código administrador"
              aria-pressed="false"
            >
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>

          <button type="submit">Entrar al panel</button>
        </form>
      </section>
    </main>

    <script src="../../js/api.js"></script>
    <script src="../../js/admin_auth.js"></script>
  </body>
</html>
