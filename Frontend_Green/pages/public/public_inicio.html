<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GreenUp | Inicio</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Inter", Arial, sans-serif;
        color: #ffffff;
        background:
          linear-gradient(120deg, rgba(0, 61, 108, 0.82), rgba(41, 108, 31, 0.66)),
          url("https://images.unsplash.com/photo-1542601906990-b4d3fb778b09?auto=format&fit=crop&w=1800&q=80");
        background-size: cover;
        background-position: center;
      }

      main {
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding: 48px;
      }

      .inicio-contenido {
        max-width: 760px;
      }

      h1 {
        margin: 0 0 16px;
        font-size: clamp(44px, 8vw, 86px);
        line-height: 0.95;
        font-weight: 900;
      }

      p {
        max-width: 560px;
        margin: 0 0 28px;
        color: rgba(255, 255, 255, 0.9);
        font-size: 19px;
        line-height: 1.6;
      }

      .acciones {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
      }

      .acciones a {
        color: #0b2545;
        background-color: #ffffff;
        padding: 13px 18px;
        border-radius: 9px;
        font-weight: 800;
        text-decoration: none;
      }

      .acciones a.secundario {
        color: #ffffff;
        background-color: rgba(255, 255, 255, 0.16);
        border: 1px solid rgba(255, 255, 255, 0.32);
      }

      @media (max-width: 640px) {
        main {
          padding: 28px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="inicio-contenido">
        <h1>GreenUp</h1>
        <p>
          Gestiona reciclaje, puntos ecologicos y comunidad desde una sola
          plataforma.
        </p>
        <div class="acciones">
          <a href="public_login.html">Iniciar sesion</a>
          <a href="public_registro.html?tipo=recicladora" class="secundario"
            >Registrar recicladora</a
          >
          <a href="admin_login.html" class="secundario">Acceso admin</a>
        </div>
      </section>
    </main>
  </body>
</html>
