<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recuperar contraseña | GreenUp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="../../css/general.css" />
    <link rel="stylesheet" href="../../css/auth_carousel.css?v=20260824" />
  </head>
  <body class="login-fondo">
    <main class="login-contenedor auth-split-simple">
      <section class="login-tarjeta">
        <h1>GreenUp</h1>
        <h2>Recuperar contraseña</h2>

        <form id="formSolicitarCodigo">
          <label for="correoRecuperacion">Correo electrónico</label>
          <input
            type="email"
            id="correoRecuperacion"
            placeholder="correo@ejemplo.com"
            required
          />

          <button type="submit" id="btnEnviar">
            Enviar código de verificación
          </button>
        </form>

        <a class="login-link-secundario" href="public_login.html">
          Volver al inicio de sesión
        </a>
      </section>
    </main>
  <script src="../../js/modal_alerts.js?v=20260824"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../../js/auth_carousel.js?v=20260824"></script>
  <script src="../../js/recuperacion.js"></script>
  <script src="../../js/public_ui_fix.js?v=20260821"></script>
</body>
</html>
