<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recuperar contraseña | GreenUp</title>
    <link rel="stylesheet" href="../../css/general.css" />
  </head>
  <body class="login-fondo">
    <main class="login-contenedor">
      <section class="login-tarjeta">
        <h1>GreenUp</h1>
        <h2>Recuperar contraseña</h2>

        <form id="formSolicitarCodigo">
          <label for="correoRecuperacion">Correo electrónico</label>
          <input
            type="email"
            id="correoRecuperacion"
            placeholder="correo@ejemplo.com"
            required
          />

          <button type="submit" id="btnEnviar">
            Enviar código de verificación
          </button>
        </form>

        <a class="login-link-secundario" href="public_login.html">
          Volver al inicio de sesión
        </a>
      </section>
    </main>
    <script src="../../js/recuperacion.js"></script>
  </body>
</html>
