<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Noticias y novedades - GreenUp Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />

  <style>
:root {
  --admin-green: #0f6f2a;
  --admin-green-dark: #075f1d;
  --admin-logo-green: #478a3a;
  --admin-blue: #065591;
  --admin-blue-dark: #043a63;
  --admin-blue-soft: #e9f4ff;
  --admin-mint: #eefbf3;
  --admin-page: #f8fbf9;
  --admin-panel: #ffffff;
  --admin-ink: #172033;
  --admin-muted: #68717b;
  --admin-border: #e3ebe6;
  --admin-soft-border: #d3e4d9;
  --admin-warning: #fff4cf;
  --admin-danger: #fff0f0;
  --sidebar-width: 316px;
  --topbar-height: 88px;
  --radius-lg: 18px;
  --shadow-soft: 0 14px 34px rgba(6, 85, 145, 0.08);
}

* {
  box-sizing: border-box;
}

html {
  min-height: 100%;
}

body.admin-app {
  min-height: 100vh;
  margin: 0;
  background: var(--admin-page);
  color: var(--admin-ink);
  font-family: "Manrope", Arial, Helvetica, sans-serif;
  letter-spacing: 0;
  overflow-x: hidden;
}

a {
  color: inherit;
  text-decoration: none;
}

button,
input,
select,
textarea {
  font: inherit;
}

.material-symbols-outlined {
  font-variation-settings: "FILL" 0, "wght" 500, "GRAD" 0, "opsz" 24;
  font-size: 24px;
  line-height: 1;
}

.material-symbols-outlined.filled {
  font-variation-settings: "FILL" 1, "wght" 650, "GRAD" 0, "opsz" 24;
}

.app-sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  z-index: 30;
  width: var(--sidebar-width);
  display: flex;
  flex-direction: column;
  gap: 24px;
  padding: 30px 24px 24px;
  background: rgba(255, 255, 255, 0.98);
  border-right: 1px solid var(--admin-border);
  box-shadow: 12px 0 32px rgba(15, 111, 42, 0.05);
  overflow-y: auto;
}

.brand-lockup,
.mobile-brand {
  display: flex;
  align-items: center;
  gap: 14px;
  min-width: 0;
}

.brand-logo {
  width: 52px;
  height: 52px;
  display: grid;
  place-items: center;
  border-radius: 15px;
  background: #ffffff;
  color: var(--admin-blue);
  font-weight: 900;
  box-shadow: 0 12px 24px rgba(15, 111, 42, 0.14);
}

.brand-logo span {
  color: var(--admin-green);
  font-size: 31px;
}

.brand-name {
  display: block;
  color: var(--admin-blue);
  font-size: 1.55rem;
  font-weight: 900;
  line-height: 1;
  white-space: nowrap;
}

.brand-name strong {
  color: var(--admin-logo-green);
  font-weight: inherit;
}

.brand-kicker {
  display: block;
  margin-top: 6px;
  color: #87909b;
  font-size: 0.72rem;
  font-weight: 850;
  letter-spacing: 0.12em;
  text-transform: uppercase;
}

.sidebar-section-title {
  margin: 0 0 8px;
  color: #9aa2ad;
  font-size: 0.74rem;
  font-weight: 850;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding-right: 4px;
}

.sidebar-link {
  min-height: 48px;
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 0 14px;
  border-radius: 14px;
  color: #606871;
  font-size: 0.93rem;
  font-weight: 750;
  transition: background-color 0.18s ease, color 0.18s ease, transform 0.18s ease;
}

.sidebar-link:hover,
.sidebar-link:focus-visible,
.sidebar-link.active {
  background: #f1f7f3;
  color: var(--admin-green-dark);
}

.sidebar-link:hover,
.sidebar-link:focus-visible {
  transform: translateX(2px);
}

.sidebar-link.active {
  box-shadow: inset -4px 0 0 var(--admin-green);
}

.sidebar-link.active .material-symbols-outlined {
  color: var(--admin-green);
  font-variation-settings: "FILL" 1, "wght" 650, "GRAD" 0, "opsz" 24;
}

.sidebar-actions {
  display: grid;
  gap: 12px;
  padding-top: 18px;
  border-top: 1px solid var(--admin-border);
}

.logout-link,
.ghost-button,
.primary-button,
.small-button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  min-height: 42px;
  border: 0;
  border-radius: 13px;
  cursor: pointer;
  font-weight: 850;
  text-align: center;
}

.logout-link {
  justify-content: flex-start;
  background: transparent;
  color: #74706f;
}

.logout-link:hover {
  color: var(--admin-green-dark);
}

.primary-button {
  padding: 0 16px;
  background: var(--admin-green);
  color: #ffffff;
  box-shadow: 0 12px 24px rgba(15, 111, 42, 0.16);
}

.primary-button:hover {
  background: var(--admin-green-dark);
}

.ghost-button,
.small-button {
  padding: 0 14px;
  background: #edf4f0;
  color: #56616d;
}

.ghost-button:hover,
.small-button:hover {
  background: #dff4e5;
  color: var(--admin-green-dark);
}

.danger-button {
  background: #fff0f0;
  color: #bd1e1e;
}

.danger-button:hover {
  background: #ffe1e1;
}

.app-topbar {
  position: fixed;
  inset: 0 0 auto var(--sidebar-width);
  z-index: 25;
  min-height: var(--topbar-height);
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 0 40px;
  background: linear-gradient(90deg, #f6fbf8 0%, #effbf4 100%);
  border-bottom: 1px solid var(--admin-border);
}

.mobile-brand {
  display: none;
}

.topbar-search {
  flex: 1 1 280px;
  min-width: 210px;
  max-width: 520px;
}

.search-shell {
  position: relative;
}

.search-shell .material-symbols-outlined {
  position: absolute;
  left: 16px;
  top: 50%;
  color: #9aa2ad;
  transform: translateY(-50%);
}

.search-shell input {
  width: 100%;
  min-height: 48px;
  padding: 0 18px 0 50px;
  border: 1px solid var(--admin-border);
  border-radius: 999px;
  background: #ffffff;
  color: var(--admin-ink);
  outline: none;
}

.search-shell input:focus {
  border-color: var(--admin-green);
  box-shadow: 0 0 0 4px rgba(15, 111, 42, 0.1);
}

.topbar-actions {
  margin-left: auto;
  display: flex;
  align-items: center;
  gap: 12px;
}

.icon-button {
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  border: 0;
  border-radius: 15px;
  background: #ffffff;
  color: #6f7680;
  cursor: pointer;
  box-shadow: 0 10px 22px rgba(6, 85, 145, 0.07);
}

.icon-button:hover {
  color: var(--admin-green-dark);
  background: var(--admin-mint);
}

.user-menu {
  display: flex;
  align-items: center;
  gap: 12px;
  min-width: 0;
  padding: 6px 14px 6px 6px;
  border-radius: 999px;
  background: #ffffff;
  box-shadow: 0 10px 22px rgba(6, 85, 145, 0.07);
}

.user-avatar {
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: linear-gradient(145deg, var(--admin-blue), #031d31);
  color: #ffffff;
  font-weight: 900;
}

.user-meta {
  display: grid;
  line-height: 1.1;
}

.user-meta strong {
  color: var(--admin-ink);
  font-size: 0.9rem;
}

.user-meta span {
  color: var(--admin-muted);
  font-size: 0.75rem;
}

.admin-main {
  min-height: 100vh;
  margin-left: var(--sidebar-width);
  padding: calc(var(--topbar-height) + 34px) 40px 44px;
}

.page-hero {
  position: relative;
  overflow: hidden;
  align-items: stretch;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(300px, 0.72fr);
  gap: 28px;
  margin-bottom: 26px;
  padding: 34px;
  border: 1px solid var(--admin-border);
  border-radius: 28px;
  background: #ffffff;
  box-shadow: var(--shadow-soft);
}

.hero-copy {
  position: relative;
  z-index: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.hero-eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
  color: var(--admin-green-dark);
  font-size: 0.78rem;
  font-weight: 900;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.page-hero h1 {
  margin: 0;
  color: var(--admin-ink);
  font-size: clamp(2.2rem, 3.2vw, 3.45rem);
  line-height: 1.04;
  overflow-wrap: anywhere;
}

.page-hero h1 strong {
  color: var(--admin-green);
}

.page-hero p {
  max-width: 690px;
  margin: 16px 0 0;
  color: #59626d;
  font-size: 1rem;
  line-height: 1.65;
}

.hero-visual {
  position: relative;
  min-height: 250px;
  border-radius: 24px;
  background:
    linear-gradient(180deg, rgba(3, 29, 49, 0.08), rgba(7, 95, 29, 0.18)),
    url("https://images.unsplash.com/photo-1532996122724-e3c354a0b15b?auto=format&fit=crop&w=1200&q=80") center/cover;
}

.hero-visual::after {
  content: "";
  position: absolute;
  inset: auto 20px 20px;
  height: 58px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.82);
  border: 1px solid rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
}

.hero-stats {
  position: relative;
  z-index: 2;
  display: grid;
  grid-template-columns: repeat(2, minmax(130px, 1fr));
  gap: 14px;
  margin-top: 24px;
  max-width: 420px;
}

.summary-card {
  min-width: 0;
  padding: 16px;
  border: 1px solid var(--admin-border);
  border-radius: 18px;
  background: var(--admin-panel);
  box-shadow: 0 18px 30px rgba(6, 85, 145, 0.08);
}

.summary-card.blue {
  background: var(--admin-blue-soft);
  border-color: #c9dff8;
}

.summary-label {
  display: block;
  color: #69727c;
  font-size: 0.75rem;
  font-weight: 850;
}

.summary-value {
  display: block;
  margin-top: 7px;
  color: var(--admin-green-dark);
  font-size: 1.45rem;
  font-weight: 900;
}

.summary-card.blue .summary-value {
  color: #0055b8;
}

.toolbar,
.data-card,
.module-card,
.admin-card {
  border: 1px solid var(--admin-border);
  border-radius: var(--radius-lg);
  background: var(--admin-panel);
  box-shadow: var(--shadow-soft);
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-bottom: 20px;
  padding: 16px;
}

.toolbar select,
.toolbar input,
.admin-form input,
.admin-form select,
.admin-form textarea {
  min-height: 44px;
  border: 1px solid var(--admin-border);
  border-radius: 13px;
  background: #ffffff;
  color: var(--admin-ink);
  outline: none;
  padding: 0 14px;
}

.admin-form textarea {
  min-height: 112px;
  padding-top: 12px;
  resize: vertical;
}

.toolbar select:focus,
.toolbar input:focus,
.admin-form input:focus,
.admin-form select:focus,
.admin-form textarea:focus {
  border-color: var(--admin-green);
  box-shadow: 0 0 0 4px rgba(15, 111, 42, 0.1);
}

.metrics-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
  margin-bottom: 20px;
}

.metric-card {
  display: grid;
  gap: 12px;
  min-height: 152px;
  padding: 20px;
  border: 1px solid var(--admin-border);
  border-radius: var(--radius-lg);
  background: var(--admin-panel);
  box-shadow: var(--shadow-soft);
}

.metric-icon {
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 14px;
  background: var(--admin-mint);
  color: var(--admin-green);
}

.metric-card.blue .metric-icon {
  background: var(--admin-blue-soft);
  color: #0055b8;
}

.metric-card strong {
  color: var(--admin-ink);
  font-size: 1.85rem;
  line-height: 1;
}

.metric-card span {
  color: var(--admin-muted);
  font-weight: 800;
}

.metric-card p {
  margin: 0;
  color: #6a737d;
  font-size: 0.86rem;
}

.content-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(320px, 0.75fr);
  gap: 20px;
}

.content-grid.catalog-layout {
  grid-template-columns: minmax(300px, 0.58fr) minmax(0, 1.42fr);
  align-items: start;
}

.content-grid.content-layout {
  grid-template-columns: minmax(300px, 0.7fr) minmax(0, 1.3fr);
  align-items: start;
}

.data-card,
.module-card,
.admin-card {
  padding: 22px;
}

.card-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}

.card-title-row h2,
.card-title-row h3 {
  margin: 0;
  color: var(--admin-ink);
  font-size: 1.1rem;
}

.card-title-row p {
  margin: 4px 0 0;
  color: var(--admin-muted);
  font-size: 0.88rem;
}

.table-wrap {
  width: 100%;
  overflow-x: auto;
}

.admin-table {
  width: 100%;
  min-width: 860px;
  border-collapse: collapse;
}

.admin-table th {
  padding: 14px 12px;
  color: #626c77;
  font-size: 0.78rem;
  font-weight: 900;
  letter-spacing: 0.06em;
  text-align: left;
  text-transform: uppercase;
  border-bottom: 1px solid var(--admin-border);
}

.admin-table td {
  padding: 14px 12px;
  color: #384250;
  font-size: 0.9rem;
  border-bottom: 1px solid #edf2ef;
  vertical-align: middle;
}

.admin-table tbody tr:hover td {
  background: #fbfdfc;
}

.row-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.status-pill,
.type-pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  min-height: 30px;
  padding: 0 10px;
  border-radius: 999px;
  font-size: 0.78rem;
  font-weight: 900;
}

.status-pill.active,
.type-pill.green {
  border: 1px solid #bde2c6;
  background: #e9f8ee;
  color: #146c2e;
}

.status-pill.inactive,
.type-pill.red {
  border: 1px solid #ffc9c9;
  background: #fff0f0;
  color: #bd1e1e;
}

.status-pill.pending,
.type-pill.blue {
  border: 1px solid #c7defa;
  background: #edf5ff;
  color: #0055b8;
}

.empty-state {
  display: grid;
  place-items: center;
  min-height: 190px;
  color: var(--admin-muted);
  text-align: center;
  border: 1px dashed var(--admin-soft-border);
  border-radius: 18px;
  background:
    linear-gradient(90deg, rgba(15, 111, 42, 0.05) 1px, transparent 1px),
    linear-gradient(rgba(15, 111, 42, 0.05) 1px, transparent 1px),
    #f8fcfa;
  background-size: 34px 34px;
}

.empty-state span {
  display: block;
  margin-bottom: 10px;
  color: var(--admin-green);
  font-size: 40px;
}

.admin-form {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

.admin-form label {
  display: grid;
  gap: 7px;
  color: #4c5966;
  font-size: 0.84rem;
  font-weight: 850;
}

.admin-form .full {
  grid-column: 1 / -1;
}

.news-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 16px;
}

.news-card {
  overflow: hidden;
  border: 1px solid var(--admin-border);
  border-radius: 18px;
  background: #ffffff;
}

.news-image {
  height: 145px;
  background: linear-gradient(135deg, var(--admin-blue-soft), var(--admin-mint));
}

.news-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.news-body {
  padding: 16px;
}

.news-body h3 {
  margin: 0 0 8px;
  color: var(--admin-ink);
}

.news-body p {
  margin: 0;
  color: var(--admin-muted);
  line-height: 1.5;
}

.map-shell {
  overflow: hidden;
  min-height: 660px;
  border: 1px solid var(--admin-border);
  border-radius: 24px;
  background: #ffffff;
  box-shadow: var(--shadow-soft);
}

#admin-map {
  width: 100%;
  height: 660px;
}

.toast-stack {
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 1000;
  display: grid;
  gap: 10px;
}

.admin-toast {
  min-width: 280px;
  max-width: 360px;
  padding: 14px 16px;
  border: 1px solid var(--admin-soft-border);
  border-radius: 16px;
  background: #ffffff;
  color: var(--admin-ink);
  box-shadow: 0 18px 40px rgba(6, 85, 145, 0.16);
}

.admin-toast strong {
  display: block;
  margin-bottom: 4px;
  color: var(--admin-green-dark);
}

@media (max-width: 1160px) {
  :root {
    --sidebar-width: 290px;
  }

  .metrics-grid,
  .content-grid,
  .content-grid.catalog-layout,
  .content-grid.content-layout,
  .page-hero {
    grid-template-columns: 1fr;
  }

  .hero-stats {
    max-width: none;
  }
}

@media (max-width: 900px) {
  .app-sidebar {
    display: none;
  }

  .app-topbar {
    inset: 0 0 auto 0;
    padding: 0 18px;
  }

  .mobile-brand {
    display: flex;
  }

  .topbar-search,
  .user-menu {
    display: none;
  }

  .admin-main {
    margin-left: 0;
    padding: calc(var(--topbar-height) + 22px) 18px 90px;
  }

  .metrics-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }

  .admin-form {
    grid-template-columns: 1fr;
  }

  .mobile-bottom-nav {
    position: fixed;
    inset: auto 14px 14px;
    z-index: 40;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 4px;
    padding: 8px;
    border: 1px solid var(--admin-border);
    border-radius: 22px;
    background: rgba(255, 255, 255, 0.97);
    box-shadow: 0 18px 42px rgba(6, 85, 145, 0.16);
  }

  .mobile-bottom-nav a {
    min-height: 54px;
    display: grid;
    place-items: center;
    border-radius: 16px;
    color: #6d737b;
  }

  .mobile-bottom-nav a.active {
    background: var(--admin-mint);
    color: var(--admin-green-dark);
  }
}

@media (min-width: 901px) {
  .mobile-bottom-nav {
    display: none;
  }
}

@media (max-width: 640px) {
  .metrics-grid {
    grid-template-columns: 1fr;
  }

  .page-hero {
    padding: 24px;
  }

  .hero-stats {
    flex-direction: column;
  }

  .toolbar {
    align-items: stretch;
    flex-direction: column;
  }

  .toolbar > * {
    width: 100%;
  }
}

  </style>
</head>
<body class="admin-app">
  <!--
    Pantalla del Administrador del Sistema.
    Todo el codigo visual y funcional esta visible en este HTML:
    - CSS visible dentro del bloque de estilos
    - JavaScript visible dentro del bloque de codigo
    - No se registran ciudadanos ni recicladoras desde el administrador.
  -->

  <script src="../../js/api.js"></script>
  <script>
    window.ADMIN_MODULE = "novedades";

/*
  Archivo: admin_sistema_layout.js

  Para que sirve:
  Construye todas las pantallas del Administrador del Sistema desde un solo
  lugar. Cada HTML solo indica el modulo con window.ADMIN_MODULE.

  Importante:
  - El administrador NO registra ciudadanos ni recicladoras.
  - Ciudadanos y recicladoras aparecen porque ya se registraron en sus pantallas.
  - El administrador consulta, filtra, exporta, activa o inactiva registros.
  - El mapa se actualiza automaticamente leyendo los puntos de Supabase.
*/

const ADMIN_API_BASE = typeof API_URL !== "undefined" ? API_URL : "http://127.0.0.1:5000";
const ADMIN_REFRESH_MS = 8000;
const ADMIN_HOME = "admin_panel.html";

let adminTableData = [];
let adminTableColumns = [];
let adminLastUserCount = null;
let adminLastPointCount = null;
let adminMonitor = null;
let adminMap = null;
let adminMarkers = new Map();
let adminUserMarker = null;
let adminWatchId = null;

const adminPrimaryNav = [

function moduloActual() {
  return window.ADMIN_MODULE || "panel";
}

function obtenerAdminActual() {
  try {
    return JSON.parse(localStorage.getItem("usuario") || "{}");
  } catch {
    return {};
  }
}

function protegerAdminSistema() {
  const admin = obtenerAdminActual();
  if (!admin.id_usuario || Number(admin.id_rol) !== 1) {
    window.location.href = "../public/admin_login.html";
  }
}

function headersAdmin() {
  const admin = obtenerAdminActual();
  return {
    "Content-Type": "application/json",
    "id-usuario": admin.id_usuario,
    "id-rol": admin.id_rol,
  };
}

async function apiAdmin(ruta, opciones = {}) {
  const respuesta = await fetch(ADMIN_API_BASE + ruta, {
    ...opciones,
    headers: { ...headersAdmin(), ...(opciones.headers || {}) },
  });
  const datos = await respuesta.json().catch(() => ({}));
  if (!respuesta.ok) {
    throw new Error(datos.mensaje || datos.error || "No se pudo conectar con " + ruta);
  }
  return datos;
}

async function guardarCrud(nombre, evento) {
  evento.preventDefault();
  const config = crudConfig[nombre];
  const payload = leerFormulario(config.campos);
  await apiAdmin(config.crear, { method: "POST", body: JSON.stringify(payload) });
  mostrarToast("Registro guardado", "El catalogo fue actualizado correctamente.");
  await cargarCrud(nombre);
}

async function editarCrud(nombre, id) {
  const config = crudConfig[nombre];
  const actual = await apiAdmin(config.buscar + id);
  const payload = {};
  for (const campo of config.campos) {
    const nuevo = prompt(campo.label, actual[campo.id] ?? "");
    if (nuevo === null) return;
    payload[campo.id] = normalizarValor(campo, nuevo);
  }
  await apiAdmin(config.actualizar + id, { method: "PUT", body: JSON.stringify(payload) });
  mostrarToast("Registro actualizado", "Los cambios quedaron guardados.");
  await cargarCrud(nombre);
}

async function inhabilitarCrud(nombre, id) {
  const config = crudConfig[nombre];
  if (!confirm("Deseas inactivar este registro?")) return;
  if (config.inhabilitar) {
    await apiAdmin(config.inhabilitar + id, { method: "DELETE" });
  } else {
    await apiAdmin(config.estado.replace(":id", id), {
      method: "PUT",
      body: JSON.stringify({ id_estado: 2 }),
    });
  }
  mostrarToast("Registro inactivado", "El estado fue actualizado.");
  await cargarCrud(nombre);
}

function iniciarMapaLeaflet() {
  if (adminMap) {
    adminMap.remove();
    adminMarkers.clear();
  }
  adminMap = L.map("admin-map", { zoomControl: true }).setView([10.4631, -73.2532], 13);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "&copy; OpenStreetMap",
  }).addTo(adminMap);
}

async function actualizarPuntosMapa(manual = false) {
  const puntos = await apiAdmin("/ubicaciones");
  await pintarPuntosMapa(puntos, false);
  if (manual) mostrarToast("Mapa actualizado", "Los puntos fueron consultados nuevamente.");
}

async function pintarPuntosMapa(puntos, ajustarVista = false) {
  if (!adminMap) return;
  const bounds = [];

  if (adminLastPointCount !== null && puntos.length > adminLastPointCount) {
    notificarAdmin("Nuevo punto ecologico", "El mapa del administrador ya fue actualizado.");
  }
  adminLastPointCount = puntos.length;

  for (const punto of puntos) {
    const coords = await coordenadasPunto(punto);
    if (!coords) continue;

    bounds.push([coords.lat, coords.lng]);
    const html = `
      <strong>${limpiar(punto.nombre)}</strong><br>
      ${limpiar(punto.direccion)}<br>
      ${estadoHtml(punto.id_estado)}
    `;

    if (adminMarkers.has(punto.id_punto)) {
      adminMarkers.get(punto.id_punto).setLatLng([coords.lat, coords.lng]).setPopupContent(html);
    } else {
      const marker = L.marker([coords.lat, coords.lng]).addTo(adminMap).bindPopup(html);
      adminMarkers.set(punto.id_punto, marker);
    }
  }

  if (ajustarVista && bounds.length) {
    adminMap.fitBounds(bounds, { padding: [40, 40] });
  }
}

async function coordenadasPunto(punto) {
  const lat = Number(punto.latitud);
  const lng = Number(punto.longitud);
  if (Number.isFinite(lat) && Number.isFinite(lng)) return { lat, lng };

  const clave = "greenup_geo_" + punto.id_punto;
  const guardado = localStorage.getItem(clave);
  if (guardado) return JSON.parse(guardado);

  if (!punto.direccion) return null;
  const consulta = encodeURIComponent(`${punto.direccion}, Valledupar, Colombia`);
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${consulta}`;
  const respuesta = await fetch(url);
  const datos = await respuesta.json();
  if (!datos.length) return null;

  const coords = { lat: Number(datos[0].lat), lng: Number(datos[0].lon) };
  localStorage.setItem(clave, JSON.stringify(coords));
  return coords;
}

function iniciarGeolocalizacionAdmin() {
  if (!navigator.geolocation || !adminMap) return;
  if (adminWatchId) navigator.geolocation.clearWatch(adminWatchId);

  adminWatchId = navigator.geolocation.watchPosition(
    (posicion) => {
      const coords = [posicion.coords.latitude, posicion.coords.longitude];
      if (!adminUserMarker) {
        adminUserMarker = L.circleMarker(coords, {
          radius: 9,
          color: "#065591",
          fillColor: "#0f6f2a",
          fillOpacity: 0.9,
        }).addTo(adminMap).bindPopup("Tu ubicacion actual");
      } else {
        adminUserMarker.setLatLng(coords);
      }
    },
    () => mostrarToast("Ubicacion", "No fue posible obtener tu ubicacion actual."),
    { enableHighAccuracy: true, maximumAge: 5000, timeout: 12000 },
  );
}

function centrarUbicacionAdmin() {
  if (adminUserMarker && adminMap) {
    adminMap.setView(adminUserMarker.getLatLng(), 16);
  } else {
    iniciarGeolocalizacionAdmin();
    mostrarToast("Ubicacion", "Solicitando ubicacion del navegador.");
  }
}

function asegurarLeaflet() {
  return new Promise((resolve, reject) => {
    if (window.L) return resolve();

    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(css);

    const script = document.createElement("script");
    script.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    script.onload = resolve;
    script.onerror = () => reject(new Error("No se pudo cargar Leaflet."));
    document.head.appendChild(script);
  });
}

function pintarTablaActual(data = adminTableData) {
  const contenedor = document.getElementById("tabla-admin");
  if (!contenedor) return;
  if (!data.length) {
    contenedor.innerHTML = renderEmpty("database", "No hay registros para mostrar.", "Cuando existan datos en Supabase apareceran aqui.");
    return;
  }

  const tieneAcciones = data.some((row) => row.actions);
  contenedor.innerHTML = `
    <div class="table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            ${adminTableColumns.map((col) => `<th>${limpiar(col)}</th>`).join("")}
            ${tieneAcciones ? "<th>Acciones</th>" : ""}
          </tr>
        </thead>
        <tbody>
          ${data.map((row) => `
            <tr>
              ${row.values.map((value) => `<td>${value}</td>`).join("")}
              ${tieneAcciones ? `<td><div class="row-actions">${row.actions || ""}</div></td>` : ""}
            </tr>
          `).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function filtrarTablaActual() {
  const search = (document.getElementById("admin-search")?.value || "").toLowerCase();
  const tipo = document.getElementById("filtro-tipo-usuario")?.value || "";
  const estado = document.getElementById("filtro-estado")?.value || "";

  const filtrada = adminTableData.filter((row) => {
    const texto = row.values.map((v) => String(v).replace(/<[^>]+>/g, "")).join(" ").toLowerCase();
    const cumpleBusqueda = !search || texto.includes(search);
    const cumpleTipo = !tipo || texto.includes(tipo.toLowerCase());
    const cumpleEstado = !estado || texto.includes(estado.toLowerCase());
    return cumpleBusqueda && cumpleTipo && cumpleEstado;
  });

  pintarTablaActual(filtrada);
}

function tablaDatos(columnas, filas) {
  if (!filas.length) return renderEmpty("database", "No hay registros.", "Los datos apareceran cuando existan en Supabase.");
  return `
    <div class="table-wrap">
      <table class="admin-table">
        <thead><tr>${columnas.map((c) => `<th>${limpiar(c)}</th>`).join("")}</tr></thead>
        <tbody>
          ${filas.map((fila) => `<tr>${fila.map((v) => `<td>${limpiarHtmlPermitido(v)}</td>`).join("")}</tr>`).join("")}
        </tbody>
      </table>
    </div>
  `;
}

function renderForm(id, campos, accion, textoBoton) {
  return `
    <form id="${id}" class="admin-form" onsubmit="${accion}">
      ${campos.map((campo) => renderField(campo)).join("")}
      <button class="primary-button full" type="submit">
        <span class="material-symbols-outlined">save</span>${textoBoton}
      </button>
    </form>
  `;
}

function renderField(campo) {
  const clase = campo.full ? "full" : "";
  if (campo.type === "textarea") {
    return `<label class="${clase}">${campo.label}<textarea id="${campo.id}"></textarea></label>`;
  }
  if (campo.type === "select") {
    return `
      <label class="${clase}">${campo.label}
        <select id="${campo.id}">
          ${campo.options.map((op) => `<option value="${op[0]}">${op[1]}</option>`).join("")}
        </select>
      </label>
    `;
  }
  return `<label class="${clase}">${campo.label}<input id="${campo.id}" type="${campo.type || "text"}" value="${campo.value || ""}"></label>`;
}

function leerFormulario(campos) {
  const data = {};
  campos.forEach((campo) => {
    const elemento = document.getElementById(campo.id);
    if (!elemento) return;
    data[campo.id] = normalizarValor(campo, elemento.value);
  });
  return data;
}

function normalizarValor(campo, valor) {
  if (campo.type === "number") return valor === "" ? null : Number(valor);
  if (campo.id && campo.id.startsWith("id_")) return valor === "" ? null : Number(valor);
  return valor;
}

function metric(icon, value, label, detail, color = "") {
  return `
    <article class="metric-card ${color}">
      <span class="metric-icon"><span class="material-symbols-outlined">${icon}</span></span>
      <strong>${limpiar(value)}</strong>
      <span>${limpiar(label)}</span>
      <p>${limpiar(detail)}</p>
    </article>
  `;
}

function renderNewsList(noticias) {
  if (!noticias.length) return renderEmpty("newspaper", "No hay noticias registradas.", "Cuando publiques novedades apareceran aqui.");
  return noticias.map((n) => `
    <div class="news-body">
      <h3>${limpiar(n.titulo)}</h3>
      <p>${limpiar(n.descripcion)}</p>
    </div>
  `).join("");
}

function renderNewsGrid(noticias) {
  if (!noticias.length) return renderEmpty("newspaper", "No hay noticias registradas.", "Publica la primera novedad desde el formulario.");
  return `
    <div class="news-grid">
      ${noticias.map((n) => {
        const activo = Number(n.id_estado) === 1;
        return `
          <article class="news-card">
            <div class="news-image">
              ${n.imagen ? `<img src="${limpiar(n.imagen)}" alt="${limpiar(n.titulo)}">` : ""}
            </div>
            <div class="news-body">
              <h3>${limpiar(n.titulo)}</h3>
              <p>${limpiar(n.descripcion)}</p>
              <p>${estadoHtml(n.id_estado)}</p>
              <div class="row-actions">
                <button class="small-button ${activo ? "danger-button" : ""}" type="button" onclick="cambiarEstadoNovedad(${n.id_novedad}, ${activo ? 2 : 1})">
                  ${activo ? "Inactivar" : "Activar"}
                </button>
              </div>
            </div>
          </article>
        `;
      }).join("")}
    </div>
  `;
}

function renderEmpty(icon, title, text) {
  return `
    <div class="empty-state">
      <div>
        <span class="material-symbols-outlined">${icon}</span>
        <strong>${limpiar(title)}</strong>
        <p>${limpiar(text)}</p>
      </div>
    </div>
  `;
}

function estadoHtml(idEstado) {
  const activo = Number(idEstado) === 1;
  return `<span class="status-pill ${activo ? "active" : "inactive"}">${activo ? "Activo" : "Inactivo"}</span>`;
}

function nombreRol(idRol) {
  const roles = { 1: "Administrador", 2: "Recicladora", 3: "Ciudadano" };
  return roles[Number(idRol)] || "Sin rol";
}

function limpiar(valor) {
  return String(valor ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function limpiarHtmlPermitido(valor) {
  const texto = String(valor ?? "");
  if (texto.includes("status-pill") || texto.includes("type-pill")) return texto;
  return limpiar(texto);
}

function iniciales(nombre) {
  return String(nombre || "A").trim().slice(0, 1).toUpperCase();
}

function pedirPermisoNotificaciones() {
  if (!("Notification" in window)) {
    mostrarToast("Notificaciones", "Este navegador no soporta notificaciones.");
    return;
  }
  Notification.requestPermission().then((permiso) => {
    mostrarToast("Notificaciones", permiso === "granted" ? "Permiso activado." : "Permiso no activado.");
  });
}

function notificarAdmin(titulo, cuerpo) {
  mostrarToast(titulo, cuerpo);
  if ("Notification" in window && Notification.permission === "granted") {
    new Notification(titulo, { body: cuerpo });
  }
}

function mostrarToast(titulo, cuerpo) {
  const stack = document.getElementById("toast-stack");
  if (!stack) return;
  const toast = document.createElement("div");
  toast.className = "admin-toast";
  toast.innerHTML = `<strong>${limpiar(titulo)}</strong>${limpiar(cuerpo)}`;
  stack.appendChild(toast);
  setTimeout(() => toast.remove(), 4200);
}

function iniciarMonitoreoAdmin() {
  if (adminMonitor) clearInterval(adminMonitor);
  adminMonitor = setInterval(async () => {
    try {
      const usuarios = await apiAdmin("/api/usuarios/listar");
      if (adminLastUserCount !== null && usuarios.length > adminLastUserCount) {
        notificarAdmin("Nuevo usuario registrado", "La tabla del administrador se actualizara automaticamente.");
        if (moduloActual() === "usuarios" || moduloActual() === "panel") await cargarModuloAdmin();
      }
      adminLastUserCount = usuarios.length;

      if (moduloActual() === "mapa") await actualizarPuntosMapa(false);
      if (["puntos", "reportes", "estadisticas"].includes(moduloActual())) await cargarModuloAdmin();
    } catch (error) {
      console.warn("No se pudo ejecutar el monitoreo admin", error);
    }
  }, ADMIN_REFRESH_MS);
}

function exportarTablaCSV(nombreArchivo) {
  const filas = adminTableData;
  if (!filas.length) {
    mostrarToast("Exportacion", "No hay datos para exportar.");
    return;
  }
  const csv = [
    adminTableColumns.join(","),
    ...filas.map((row) => row.values.map((value) => `"${String(value).replace(/<[^>]+>/g, "").replaceAll('"', '""')}"`).join(",")),
  ].join("\n");

  const enlace = document.createElement("a");
  enlace.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
  enlace.download = nombreArchivo;
  enlace.click();
  URL.revokeObjectURL(enlace.href);
}

function cerrarSesionAdminSistema() {
  localStorage.removeItem("usuario");
  window.location.href = "../public/admin_login.html";
}

  </script>
</body>
