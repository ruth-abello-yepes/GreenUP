    <style>
        /* Variables de Marca GreenUp */
        :root {
            --gu-primary: #003d6c;
            --gu-secondary: #296c1f;
            --gu-surface: #f8f9ff;
            --gu-dark: #121c2a;
            --gu-accent: #a9f295;
            --gu-light-blue: #e6eeff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--gu-surface);
            display: flex;
            flex-direction: column;
            height: 100vh;
            /* Fija la altura al 100% de la ventana */
            overflow: hidden;
            /* Evita el scroll global */
        }

        /* Utilidades Personalizadas */
        .text-gu-primary {
            color: var(--gu-primary);
        }

        .text-gu-secondary {
            color: var(--gu-secondary);
        }

        .bg-gu-primary {
            background-color: var(--gu-primary);
        }

        .bg-gu-secondary {
            background-color: var(--gu-secondary);
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }

        /* Ocultar scrollbar en el panel lateral */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Ajustes Navbar */
        .nav-link.active-custom {
            color: var(--gu-secondary) !important;
            border-bottom: 2px solid var(--gu-secondary);
            font-weight: bold;
        }

        .hover-bg-light:hover {
            background-color: #f1f5f9;
        }

        /* Estilos del Mapa y Panel Lateral */
        main {
            position: relative;
            flex-grow: 1;
            margin-top: 70px;
            display: flex;
        }

        #eco-map {
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #sidebar-panel {
            width: 320px;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
        }

        #sidebar-panel.collapsed {
            transform: translateX(calc(-100% - 20px));
            /* Oculta el panel hacia la izquierda */
        }

        #sidebar-collapse-trigger {
            position: absolute;
            right: -40px;
            top: 15px;
            width: 40px;
            height: 40px;
            border-radius: 0 12px 12px 0;
            transition: all 0.3s;
        }

        #sidebar-panel.collapsed #sidebar-collapse-trigger .icon-arrow {
            transform: rotate(180deg);
        }

        .gu-sidebar-item {
            transition: all 0.2s;
            border: 1px solid rgba(0, 0, 0, 0.1);
        }

        .gu-sidebar-item:hover {
            border-color: var(--gu-secondary);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            transform: translateX(4px);
        }

        /* Leaflet Popups */
        .leaflet-popup-content-wrapper {
            border-radius: 12px;
            padding: 4px;
            font-family: 'Inter', sans-serif;
        }
    </style>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // Configuración de Leaflet
        const mapCenter = [10.4631, -73.2532]; // Valledupar, Cesar
        const map = L.map('eco-map', { zoomControl: false, attributionControl: false }).setView(mapCenter, 14);

        // Capa estándar de OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        function centerMap() { map.setView(mapCenter, 14, { animate: true }); }

        // Datos Ficticios de Puntos de Reciclaje
        const markersData = [
            { id: 1, pos: [10.4650, -73.2550], title: "EcoPunto Valledupar Norte", address: "Calle 12 #4-56", type: "Plástico, Papel, Vidrio", color: "#065591", icon: "location_on" },
            { id: 2, pos: [10.4610, -73.2510], title: "Centro GreenUp El Guatapurí", address: "Av. Militar, Local 204", type: "Metales, Electrónicos", color: "#296c1f", icon: "eco" },
            { id: 3, pos: [10.4720, -73.2450], title: "Punto Verde Comuna 5", address: "Carrera 23 #18-90", type: "Aceites, Pilas", color: "#a0caff", icon: "battery_charging_full" }
        ];

        const sidebarList = document.getElementById('recycling-list');

        markersData.forEach(point => {
            // Generar marcador circular en el mapa
            const marker = L.circleMarker(point.pos, {
                radius: 10, fillColor: point.color, color: "#fff", weight: 2, opacity: 1, fillOpacity: 0.9
            }).addTo(map);

            // Contenido del Popup al hacer clic en el mapa
            marker.bindPopup(`
                <div class="p-1 min-w-[150px]">
                    <h6 class="fw-bold text-dark mb-1" style="color: ${point.color};">${point.title}</h6>
                    <p class="text-muted small mb-2" style="font-size: 11px;">${point.address}</p>
                    <div class="mb-3">
                        <span class="small fw-bold" style="color: var(--gu-secondary);">Acepta:</span><br>
                        <span class="small fw-medium">${point.type}</span>
                    </div>
                    <a href="#" class="btn btn-sm w-100 fw-bold text-white rounded-pill" style="background-color: var(--gu-secondary); font-size: 11px;">Cómo llegar</a>
                </div>
            `);

            // Generar tarjeta en la lista del panel lateral (Sidebar)
            const item = document.createElement('div');
            item.className = "p-3 bg-white border rounded-4 mb-3 cursor-pointer gu-sidebar-item";
            item.innerHTML = `
                <div class="d-flex gap-3 align-items-center">
                    <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width: 45px; height: 45px; background-color: ${point.color}15">
                        <span class="material-symbols-outlined" style="color: ${point.color}">${point.icon}</span>
                    </div>
                    <div class="flex-grow-1 overflow-hidden">
                        <h6 class="fw-bold text-dark mb-0 text-truncate" style="font-size: 0.9rem;">${point.title}</h6>
                        <p class="text-muted mb-1 text-truncate" style="font-size: 0.75rem;">${point.address}</p>
                        <span class="badge bg-light text-secondary border">Reciclaje</span>
                    </div>
                </div>
            `;

            // Interacción: Clic en la tarjeta de la lista -> mover mapa y abrir popup
            item.onclick = () => {
                map.setView(point.pos, 16, { animate: true });
                setTimeout(() => marker.openPopup(), 400);
                if (window.innerWidth < 768) toggleSidebar(); // Auto-ocultar en móviles
            };
            sidebarList.appendChild(item);
        });

        // Lógica del Panel Lateral (Sidebar)
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar-panel');
            sidebar.classList.toggle('collapsed');

            // Dar tiempo a la animación CSS antes de reajustar Leaflet
            setTimeout(() => map.invalidateSize(), 300);
        }

        // Colapsar panel automáticamente en pantallas pequeñas al iniciar
        if (window.innerWidth < 768) {
            document.getElementById('sidebar-panel').classList.add('collapsed');
        }

        // Reajustar el canvas del mapa si la ventana cambia de tamaño
        window.addEventListener('resize', () => map.invalidateSize());
    </script>
