<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recuperar contraseña | GreenUp</title>
    <link rel="stylesheet" href="../../css/general.css" />
  </head>
  <body class="login-fondo">
    <main class="login-contenedor">
      <section class="login-tarjeta">
        <h1>GreenUp</h1>
        <h2>Recuperar contraseña</h2>

        <form>
          <label for="correo">Correo electrónico</label>
          <input
            type="email"
            id="correo"
            placeholder="correo@ejemplo.com"
            required
          />

          <button type="button" onclick="alert('Solicitud registrada')">
            Enviar solicitud
          </button>
        </form>

        <p style="text-align: center; margin-bottom: 0">
          <a href="public_login.html">Volver al inicio de sesión</a>
        </p>
      </section>
    </main>
  </body>
</html>
