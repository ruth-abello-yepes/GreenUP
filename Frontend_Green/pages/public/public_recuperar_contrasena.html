<!doctype html>
<html lang="es">
  <head>
  <link rel="stylesheet" href="../../bootstrap/css/bootstrap.min.css">


    <meta charset="UTF-8" />
      <link rel="icon" type="image/png" href="../../img/logo-greenup.png">
<meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Recuperar contraseña | GreenUp</title>
    <link rel="stylesheet" href="../../css/general.css?v=20260831" />
  </head>
  <body class="login-fondo">
    <main class="login-contenedor">
      <section class="login-tarjeta">
        <h1>GreenUp</h1>
        <h2>Recuperar contraseña</h2>

        <p class="recovery-notice">
          Te enviaremos un código de 6 dígitos. Por seguridad, tendrás 60 segundos para ingresarlo.
        </p>

        <form id="formSolicitarCodigo">
          <label for="correoRecuperacion">Correo electrónico</label>
          <input
            type="email"
            id="correoRecuperacion"
            placeholder="correo@ejemplo.com"
            required
          />

          <button type="submit" id="btnEnviar">
            Enviar código de verificación
          </button>
        </form>

        <a class="login-link-secundario" href="public_login.html">
          Volver al inicio de sesión
        </a>
      </section>
    </main>
    <script src="../../bootstrap/js/bootstrap.bundle.min.js"></script>
<script src="../../js/modal_alerts.js?v=20260827"></script>
  <script src="../../js/api.js"></script>
  <script src="../../js/recuperacion.js?v=20260831"></script>
  <script src="../../js/public_ui_fix.js?v=20260901-a11y3"></script>
</body>
</html>
